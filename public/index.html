<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Rainfall Weather HK</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <h2>Rainfall Weather HK</h2>
    <div class="input_container">
      <form id="user_input_form">
        <!-- left container (district, year range, time range, time mode) -->
        <div class="left_container">
          <h3>Stats Range</h3>
          <div class="district_selection">
            <label for="district_input"
              >District(s): (Multiple Choice, empty for all districts)</label
            >
            <table>
              <tr>
                <td>
                  <input type="checkbox" name="selected_districts" value="1" />
                  中西區
                </td>
                <td>
                  <input type="checkbox" name="selected_districts" value="2" />
                  東區
                </td>
                <td>
                  <input type="checkbox" name="selected_districts" value="3" />
                  離島區
                </td>
                <td>
                  <input type="checkbox" name="selected_districts" value="4" />
                  九龍城
                </td>
                <td>
                  <input type="checkbox" name="selected_districts" value="5" />
                  觀塘
                </td>
                <td>
                  <input type="checkbox" name="selected_districts" value="6" />
                  葵青
                </td>
              </tr>
              <tr>
                <td>
                  <input type="checkbox" name="selected_districts" value="7" />
                  北區
                </td>
                <td>
                  <input type="checkbox" name="selected_districts" value="8" />
                  西貢
                </td>

                <td>
                  <input type="checkbox" name="selected_districts" value="9" />
                  沙田
                </td>
                <td>
                  <input type="checkbox" name="selected_districts" value="10" />
                  深水埗
                </td>
                <td>
                  <input type="checkbox" name="selected_districts" value="11" />
                  南區
                </td>
                <td>
                  <input type="checkbox" name="selected_districts" value="12" />
                  大埔
                </td>
              </tr>
              <tr>
                <td>
                  <input type="checkbox" name="selected_districts" value="13" />
                  荃灣
                </td>
                <td>
                  <input type="checkbox" name="selected_districts" value="14" />
                  屯門
                </td>
                <td>
                  <input type="checkbox" name="selected_districts" value="15" />
                  灣仔
                </td>
                <td>
                  <input type="checkbox" name="selected_districts" value="16" />
                  黃大仙
                </td>

                <td>
                  <input type="checkbox" name="selected_districts" value="17" />
                  油尖旺
                </td>
                <td>
                  <input type="checkbox" name="selected_districts" value="18" />
                  元朗
                </td>
              </tr>
              <tr>
                <td>
                  <input type="checkbox" name="selected_districts" value="19" />
                  大嶼山
                </td>
                <td>
                  <input type="checkbox" name="selected_districts" value="20" />
                  南丫島
                </td>
                <td>
                  <input type="checkbox" name="selected_districts" value="21" />
                  九龍西
                </td>
                <td>
                  <input type="checkbox" name="selected_districts" value="22" />
                  九龍東
                </td>
              </tr>
            </table>
          </div>

          <div class="start_year_selection">
            <label for="start_year">Start Year of Data Range:</label>
            <select id="start_year" name="start_year">
              <option value="2003">2003</option>
              <option value="2004">2004</option>
              <option value="2005">2005</option>
              <option value="2006">2006</option>
              <option value="2007">2007</option>
              <option value="2008">2008</option>
              <option value="2009">2009</option>
              <option value="2010">2010</option>
              <option value="2011">2011</option>
              <option value="2012">2012</option>
              <option value="2013">2013</option>
              <option value="2014">2014</option>
              <option value="2015">2015</option>
              <option value="2016">2016</option>
              <option value="2017">2017</option>
              <option value="2018">2018</option>
              <option value="2019">2019</option>
              <option value="2020">2020</option>
              <option value="2021">2021</option>
              <option value="2022">2022</option>
              <option value="2023">2023</option>
            </select>
          </div>

          <div class="end_year_selection">
            <label for="end_year">End Year of Data Range:</label>
            <select id="end_year" name="end_year">
              <option value="2003">2003</option>
              <option value="2004">2004</option>
              <option value="2005">2005</option>
              <option value="2006">2006</option>
              <option value="2007">2007</option>
              <option value="2008">2008</option>
              <option value="2009">2009</option>
              <option value="2010">2010</option>
              <option value="2011">2011</option>
              <option value="2012">2012</option>
              <option value="2013">2013</option>
              <option value="2014">2014</option>
              <option value="2015">2015</option>
              <option value="2016">2016</option>
              <option value="2017">2017</option>
              <option value="2018">2018</option>
              <option value="2019">2019</option>
              <option value="2020">2020</option>
              <option value="2021">2021</option>
              <option value="2022">2022</option>
              <option value="2023" selected>2023</option>
            </select>
          </div>

          <div class="start_time_selection">
            <label for="start_hour_input">Data Range Start Hour: </label>
            <select id="start_hour_input" name="start_hour_input">
              <option value="00" selected>00</option>
              <option value="01">01</option>
              <option value="02">02</option>
              <option value="03">03</option>
              <option value="04">04</option>
              <option value="05">05</option>
              <option value="06">06</option>
              <option value="07">07</option>
              <option value="08">08</option>
              <option value="09">09</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="17">17</option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
              <option value="21">21</option>
              <option value="22">22</option>
              <option value="23">23</option>
            </select>

            <label for="start_minute_input">Start Minute: </label>
            <select id="start_minute_input" name="start_minute_input">
              <option value="00" selected>00</option>
              <option value="15">15</option>
              <option value="30">30</option>
              <option value="45">45</option>
            </select>
          </div>

          <div class="end_time_selection">
            <label for="end_hour_input">Data Range End Hour: </label>
            <select id="end_hour_input" name="end_hour_input">
              <option value="00">00</option>
              <option value="01">01</option>
              <option value="02">02</option>
              <option value="03">03</option>
              <option value="04">04</option>
              <option value="05">05</option>
              <option value="06">06</option>
              <option value="07">07</option>
              <option value="08">08</option>
              <option value="09">09</option>
              <option value="10">10</option>
              <option value="11">11</option>
              <option value="12">12</option>
              <option value="13">13</option>
              <option value="14">14</option>
              <option value="15">15</option>
              <option value="16">16</option>
              <option value="17">17</option>
              <option value="18">18</option>
              <option value="19">19</option>
              <option value="20">20</option>
              <option value="21">21</option>
              <option value="22">22</option>
              <option value="23" selected>23</option>
            </select>
            <label for="end_minute_input">End Minute: </label>
            <select id="end_minute_input" name="end_minute_input">
              <option value="00">00</option>
              <option value="15">15</option>
              <option value="30">30</option>
              <option value="45" selected>45</option>
            </select>
          </div>
        </div>
        <div class="right_container">
          <h3>View Range</h3>
          <div class="view_year_selection">
            <label for="view_year">View Year: </label>
            <input
              type="number"
              name="view_year"
              min="2025"
              max="2030"
              value="2025"
            />
          </div>

          <div class="months_selection">
            <label for="select_month"
              >Month(s) For Average Rainfall: (Multiple Choice, empty for all
              months)</label
            >
            <table>
              <tr>
                <td>
                  <input type="checkbox" name="selected_months" value="1" /> Jan
                </td>
                <td>
                  <input type="checkbox" name="selected_months" value="2" /> Feb
                </td>
                <td>
                  <input type="checkbox" name="selected_months" value="3" /> Mar
                </td>
                <td>
                  <input type="checkbox" name="selected_months" value="4" /> Apr
                </td>
                <td>
                  <input type="checkbox" name="selected_months" value="5" /> May
                </td>
                <td>
                  <input type="checkbox" name="selected_months" value="6" /> Jun
                </td>
              </tr>
              <tr>
                <td>
                  <input type="checkbox" name="selected_months" value="7" /> Jul
                </td>
                <td>
                  <input type="checkbox" name="selected_months" value="8" /> Aug
                </td>
                <td>
                  <input type="checkbox" name="selected_months" value="9" /> Sep
                </td>
                <td>
                  <input type="checkbox" name="selected_months" value="10" />
                  Oct
                </td>
                <td>
                  <input type="checkbox" name="selected_months" value="11" />
                  Nov
                </td>
                <td>
                  <input type="checkbox" name="selected_months" value="12" />
                  Dec
                </td>
              </tr>
            </table>
          </div>

          <div class="days_Selection">
            <!-- if selected start and end day is same, mean only elsect one day -->
            <label
              >Day(s) From:
              <input type="number" name="start_day" min="1" max="31" value="1"
            /></label>
            <label
              >To:
              <input type="number" name="end_day" min="1" max="31" value="31"
            /></label>
          </div>

          <div class="date_mode_selection">
            <label for="date_mode">Gregorian/Chinese Date: </label>

            <input
              type="radio"
              id="gregorian_date"
              name="date_mode"
              value="gregorian_date"
              checked
            />
            <label for="gregorian_date">Gregorian Date</label>

            <input
              type="radio"
              id="chinese_date"
              name="date_mode"
              value="chinese_date"
            />
            <label for="chinese_date">Chinese Date</label>
          </div>
          <div class="time_mode_selection">
            <label for="time_mode_input">Time Mode:</label>
            <select id="time_mode_input" name="time_mode_input">
              <option value="15mins">15mins</option>
              <option value="2hrs">2hrs</option>
              <option value="12hrs">12hrs</option>
              <option value="24hrs" selected>24hrs</option>
            </select>
          </div>
        </div>

        <div class="submit_container">
          <button id="submit_button" type="submit">Submit</button>
          <button id="reset_button" type="reset">Reset</button>
        </div>
      </form>
      <div
        class="loading_container"
        id="loading_container"
        style="display: none"
      >
        <div class="loading_spinner"></div>
        <div class="loading_text">Loading data...</div>
      </div>
    </div>
    <label for="strength_bar">Rainfall Strength Bar: </label>
    <!-- show each color represent the strength -->
    <div class="strength_bar">
      <div class="seg no_rain">No Rain</div>
      <div class="seg weak">Weak</div>
      <div class="seg moderate">Moderate</div>
      <div class="seg strong">Strong</div>
      <div class="seg extreme">Extreme</div>
    </div>
    <div id="calendar">
      <script src="./bundle.js"></script>
    </div>
  </body>
</html>
